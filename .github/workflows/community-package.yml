name: Package Community service only
on:
  push:
    branches: [release]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: community-service/package-lock.json
      - name: Test service and packager
        working-directory: community-service
        run: |
          npm ci --ignore-scripts
          npm test
          python3 -B -m unittest discover -s ../tests -p 'test_community_bundle.py' -v
      - name: Resolve locked production dependencies without install hooks
        working-directory: community-service
        run: npm ci --omit=dev --ignore-scripts
      - name: Bind exact source, dependency files, migration and run
        env:
          COMMUNITY_BUNDLE_DIR: ${{ runner.temp }}/community-bundle
        run: |
          set -Eeuo pipefail
          test "$GITHUB_REF" = refs/heads/release
          for mode in create verify; do
            python3 scripts/community-release-bundle.py "$mode" \
              --source community-service --output "$COMMUNITY_BUNDLE_DIR" \
              --repository "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" \
              --commit "$GITHUB_SHA" --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
              --node-version "$(node --version)"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: community-service-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/community-bundle/
          if-no-files-found: error
          retention-days: 30
      - run: echo 'Package only. No SSH, migration, installation or service start.' >> "$GITHUB_STEP_SUMMARY"

name: Community Service CI
on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  community:
    name: Validate community foundation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: community_fixture
          POSTGRES_PASSWORD: disposable_fixture_only
          POSTGRES_DB: community_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U community_fixture -d community_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: community-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: community-service/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Package validation rejects dependency drift and unsafe files
        run: python3 -B -m unittest discover -s ../tests -p 'test_community_bundle.py' -v
      - name: Native PostgreSQL concurrent writers and rollback
        env:
          COMMUNITY_TEST_DATABASE_URL: postgres://community_fixture:disposable_fixture_only@127.0.0.1:5432/community_fixture
        run: npm run test:postgres

  core-interoperation:
    name: Actual Core and Community interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: community_fixture
          POSTGRES_PASSWORD: disposable_fixture_only
          POSTGRES_DB: community_core_fixture
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U community_fixture -d community_core_fixture"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: community-service/package-lock.json
      # The existing Core CI job owns the complete Java unit suite. This job
      # builds its actual executable JAR for separate-process HTTP integration.
      - run: mvn -B -ntp -DskipTests package
      - run: npm ci --ignore-scripts
        working-directory: community-service
      - name: Native database, real Core login/gallery, drain and restart
        working-directory: community-service
        env:
          COMMUNITY_CORE_TEST_DATABASE_URL: postgres://community_fixture:disposable_fixture_only@127.0.0.1:5432/community_core_fixture
          COMMUNITY_CORE_TEST_OUTPUT: ${{ runner.temp }}/community-core-evidence
        run: npm run test:core
      - name: Retain sanitized fixture process logs and result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-core-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/community-core-evidence/*.log
            ${{ runner.temp }}/community-core-evidence/RESULT.json
          if-no-files-found: ignore
          retention-days: 14

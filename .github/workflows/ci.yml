name: Core API CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main, release]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: core-api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build core API
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Python for catalog batch guardrails
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test catalog batch validation and rollback tooling
        run: |
          python -m pip install --disable-pip-version-check openpyxl==3.1.5
          python -m py_compile tools/catalog_batch/validate.py tools/catalog_batch/rollback.py
          python -m unittest discover -s tools/catalog_batch/tests -p 'test_*.py'

      - name: Test and build production artifact
        run: mvn -B -ntp clean package

      - name: Test catalog Creation projection preparation
        run: |
          python3 -B -m unittest discover -s tests -p 'test_catalog_creation_projection_repair.py' -v
          python3 -B -m unittest discover -s tests -p 'test_catalog_projection_bulk.py' -v

      - name: Test catalog projection with isolated PostgreSQL and actual JPA
        run: |
          if [ ! -x /usr/lib/postgresql/16/bin/initdb ]; then
            sudo apt-get update
            sudo apt-get install -y postgresql-16
          fi
          python3 -B tests/run_catalog_projection_postgres.py \
            --fixture "$RUNNER_TEMP/catalog-projection-fixture" \
            --pg-bin /usr/lib/postgresql/16/bin \
            --pg-lib /usr/lib/x86_64-linux-gnu \
            --port 55903
          python3 -B tests/run_catalog_projection_bulk_postgres.py \
            --fixture "$RUNNER_TEMP/catalog-projection-bulk-fixture" \
            --pg-bin /usr/lib/postgresql/16/bin \
            --pg-lib /usr/lib/x86_64-linux-gnu \
            --port 55903 --jpa

      - name: Test release candidate integrity and provenance
        run: python -m unittest discover -s tests -p 'test_core_release_candidate.py'

      - name: Test read-only Knowledge asset preflight
        run: python -B -m unittest discover -s tests -p 'test_knowledge_assets.py'

      - name: Verify PostgreSQL runtime driver
        run: jar tf target/auralink-backend-0.0.1-SNAPSHOT.jar | grep -E 'BOOT-INF/lib/postgresql-[^/]+\.jar$'

      - name: Verify accepted R25 packaged contracts
        run: python3 scripts/verify-r25-artifact.py target/auralink-backend-0.0.1-SNAPSHOT.jar --output target/r25-artifact-verification.json

      - name: Preserve verified build for R25 staging
        uses: actions/upload-artifact@v4
        with:
          name: core-api-r25-${{ github.sha }}
          path: |
            target/auralink-backend-0.0.1-SNAPSHOT.jar
            target/r25-artifact-verification.json
            target/surefire-reports/
          if-no-files-found: error

  release-source:
    name: Verify main-to-release promotion
    if: github.event_name == 'pull_request' && github.base_ref == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch as the release source
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$HEAD_BRANCH" != "main" ] || [ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]; then
            echo "Only main from this repository may target release." >&2
            exit 1
          fi
          echo "Verified promotion path: main -> release"

